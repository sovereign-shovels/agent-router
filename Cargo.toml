[package]
name = "agent-router"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible proxy with heuristic model routing and cost tracking"
license = "Apache-2.0"
repository = "https://github.com/sovereign-shovels/agent-router"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
dirs = "5.0"
bytes = "1.7"
futures = "0.3"

[dev-dependencies]
tempfile = "3.13"
wiremock = "0.6"
